          <!-- ===================== CALENDAR ===================== -->
          <section class="page" id="page-calendar" data-page="calendar">
            <div class="grid">
              <div class="card col-8">
                <div class="card-head">
                  <div>
                    <h3 id="cal-title">Activity Calendar</h3>
                    <p>Every dot is a node stored in the circular linked list</p>
                  </div>
                  <div class="chip-row">
                    <button class="chip" id="cal-prev"><i data-lucide="chevron-left"></i></button>
                    <button class="chip" id="cal-today">Today</button>
                    <button class="chip" id="cal-next"><i data-lucide="chevron-right"></i></button>
                  </div>
                </div>
                <div class="calendar-weekdays" id="cal-weekdays"></div>
                <div class="calendar-grid" id="cal-grid"></div>
                <div class="calendar-legend">
                  <span><i class="dot dot-1"></i> Under 5k steps</span>
                  <span><i class="dot dot-2"></i> 5k – 9k steps</span>
                  <span><i class="dot dot-3"></i> 10k+ steps</span>
                  <span><i class="dot dot-none"></i> No record</span>
                </div>
              </div>

              <div class="card col-4">
                <div class="card-head">
                  <div>
                    <h3>Selected day</h3>
                    <p>Stored record details</p>
                  </div>
                </div>
                <div id="cal-detail"></div>
              </div>

              <div class="card col-12">
                <div class="card-head">
                  <div>
                    <h3>Month summary</h3>
                    <p>Aggregates computed from the linked list</p>
                  </div>
                </div>
                <div class="stat-strip" id="cal-summary"></div>
              </div>
            </div>
          </section>
